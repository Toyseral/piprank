name: Finish unified renderer cleanup

on:
  push:
    branches:
      - refactor/unified-content-renderer

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'finish unified renderer cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/unified-content-renderer

      - name: Migrate remaining canonical content consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/pages/Home.tsx')
          s = home.read_text()
          s = s.replace(
              "import { fetchBrokers, fetchCountries, fetchGuides, fetchIntents } from '../lib/api';",
              "import { fetchBrokers, fetchCountries, fetchIntents } from '../lib/api';\nimport { fetchPublishedContentDocuments } from '../lib/canonicalContent';"
          )
          s = s.replace(
              "Promise.all([fetchBrokers(), fetchIntents(), fetchGuides(), fetchCountries()])",
              "Promise.all([fetchBrokers(), fetchIntents(), fetchPublishedContentDocuments({ type: 'guide' }), fetchCountries()])"
          )
          s = s.replace(
              "setGuides(g);",
              "setGuides(g.filter((doc) => !doc.country_slug));"
          )
          home.write_text(s)

          broker = Path('src/pages/BrokerDetail.tsx')
          s = broker.read_text()
          s = s.replace(
              "import { createReview, fetchBroker, fetchBrokerAvailability, fetchBrokerContent, fetchBrokers, fetchBrokerVerification, fetchReviews, fetchContentDocument, voteHelpful } from '../lib/api';",
              "import { createReview, fetchBroker, fetchBrokerAvailability, fetchBrokerContent, fetchBrokers, fetchBrokerVerification, fetchReviews, voteHelpful } from '../lib/api';\nimport { fetchPublishedContentDocument } from '../lib/canonicalContent';"
          )
          s = s.replace(
              "fetchContentDocument(`broker:${b.slug}:main`).then(content=>setRichProfile(content?.published?content:null))",
              "fetchPublishedContentDocument(`broker:${b.slug}:main`).then(content=>setRichProfile(content?.published?content:null))"
          )
          broker.write_text(s)
          PY

      - name: Remove transitional api aliases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/api.ts')
          s = p.read_text()
          marker = "\n// Transitional aliases for consumers not yet migrated."
          if marker not in s:
              raise SystemExit('Transitional alias block not found')
          s = s.split(marker, 1)[0].rstrip() + "\n"
          p.write_text(s)
          PY

      - name: Verify no legacy content aliases remain
        shell: bash
        run: |
          if grep -RInE "fetchGuides|fetchGuide|fetchContentDocumentById|fetchContentDocument\(" src --exclude-dir=node_modules; then
            echo "Legacy content aliases still referenced"
            exit 1
          fi
          if grep -RIn "from '../lib/api'" src/pages/Home.tsx src/pages/BrokerDetail.tsx | grep -E "fetchGuides|fetchContentDocument"; then
            exit 1
          fi

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Build
        run: npm run build

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/finish-unified-renderer-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Home.tsx src/pages/BrokerDetail.tsx src/lib/api.ts .github/workflows/finish-unified-renderer-cleanup.yml
          git commit -m "refactor: finish unified renderer cleanup"
          git push origin HEAD:refactor/unified-content-renderer
