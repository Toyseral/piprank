name: Repair country guide publishing

on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - name: Patch country guide content handling
        shell: python
        run: |
          from pathlib import Path

          # PageManager: new manual pages are country guides, while existing
          # country-topic SEO pages and the generator remain untouched.
          p = Path('src/components/PageManager.tsx')
          s = p.read_text()
          s0 = s
          s = s.replace(
              "route:d.content_type==='broker'&&d.slug?`/brokers/${d.slug}`:d.country_slug&&d.topic_slug?`/${d.country_slug}/${d.topic_slug}`:d.country_slug?`/${d.country_slug}`:d.slug?`/${d.slug}`:'#'",
              "route:d.content_type==='broker'&&d.slug?`/brokers/${d.slug}`:d.content_type==='country-guide'&&d.country_slug&&d.slug?`/${d.country_slug}/guides/${d.slug}`:d.country_slug&&d.topic_slug?`/${d.country_slug}/${d.topic_slug}`:d.country_slug?`/${d.country_slug}`:d.slug?`/${d.slug}`:'#'"
          )
          s = s.replace(
              "const key=form.content_key||(isBroker?`broker:${form.slug}:main`:`country-topic:${form.country_slug}:${form.topic_slug}`);",
              "const key=form.content_key||(isBroker?`broker:${form.slug}:main`:(form.content_type==='country-guide'?`country-guide:${form.country_slug}:${form.slug||form.topic_slug}`:`country-topic:${form.country_slug}:${form.topic_slug}`));"
          )
          if s == s0:
              raise SystemExit('PageManager replacements did not match expected source')
          p.write_text(s)

          # Admin: make a manually-created Page Manager document a country
          # guide by default. Existing documents keep their own content_type.
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          s0 = s
          s = s.replace(
              "content_key: '', content_type: 'country-topic', country_slug: '', topic_slug: '', slug: '', title: '', excerpt: '', html: '', blocks: [] as PageBlock[], seo_title: '', seo_description: '', indexable: true, published: true,",
              "content_key: '', content_type: 'country-guide', country_slug: '', topic_slug: '', slug: '', title: '', excerpt: '', html: '', blocks: [] as PageBlock[], seo_title: '', seo_description: '', indexable: true, published: true,"
          )
          if s == s0:
              raise SystemExit('Admin default replacement did not match expected source')
          p.write_text(s)

          # API: always provide a slug when a document is indexable. The DB
          # constraint intentionally rejects indexable rows without one.
          p = Path('api/content.js')
          s = p.read_text()
          s0 = s
          old = "  const topicSlug = body.topic_slug ? slugify(body.topic_slug) : null;\n  const contentKey = String(body.content_key || [contentType, countrySlug, topicSlug, body.slug].filter(Boolean).join(':')).slice(0, 180);"
          new = "  const topicSlug = body.topic_slug ? slugify(body.topic_slug) : null;\n  const slug = body.slug ? slugify(body.slug) : (topicSlug || slugify(body.title || body.content_key || '') || null);\n  const contentKey = String(body.content_key || [contentType, countrySlug, topicSlug, slug].filter(Boolean).join(':')).slice(0, 180);"
          if old not in s:
              raise SystemExit('API normalize preamble did not match expected source')
          s = s.replace(old, new, 1)
          s = s.replace("    slug: body.slug ? slugify(body.slug) : null,", "    slug,", 1)
          p.write_text(s)

      - name: Typecheck and build
        run: |
          npm ci
          npx tsc -b
          npm run build

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PageManager.tsx src/pages/Admin.tsx api/content.js
          git commit -m 'fix: make country guides publishable' || exit 0
          git push origin seo/canonical-page-ownership-current-develop
