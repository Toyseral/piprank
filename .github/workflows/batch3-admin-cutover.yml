name: Batch 3 admin canonical editor cutover

on:
  push:
    branches:
      - fix/batch-3-broker-content-cutover

permissions:
  contents: write

jobs:
  cutover:
    if: ${{ !contains(github.event.head_commit.message, '[batch3-admin-cutover]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-3-broker-content-cutover
          fetch-depth: 0

      - name: Replace legacy broker admin drawer
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Admin.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('/* ======================= BROKER CONTENT EDITOR ======================= */')
          end = text.index('function BrokerRichDocEditor(', start)
          replacement = r'''/* ======================= BROKER CONTENT EDITOR ======================= */

          function BrokerContentEditor({ broker, token, onClose, onSave }: { broker: Broker; token: string; onClose: () => void; onSave: (document: ContentDocument) => Promise<void> }) {
            const [loading, setLoading] = useState(true);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [document, setDocument] = useState<ContentDocument | null>(null);
            const [availabilityRows, setAvailabilityRows] = useState<{ country_id: number; status: 'available' | 'restricted' | 'unavailable' | 'unknown'; note: string; priority: number }[]>([]);
            const [countries, setCountries] = useState<CountryPage[]>([]);
            const [countrySearch, setCountrySearch] = useState('');
            const [blocks, setBlocks] = useState<PageBlock[]>([]);

            const load = useCallback(async () => {
              setLoading(true); setError('');
              try {
                const [docs, av, countryRows] = await Promise.all([
                  fetch(`/api/content-documents?type=broker&slug=${encodeURIComponent(broker.slug)}`).then((r) => r.json()),
                  fetch(`/api/broker-assets?resource=availability&broker_id=${broker.id}`).then((r) => r.json()).catch(() => []),
                  fetch('/api/countries').then((r) => r.json()).catch(() => []),
                ]);
                const list = Array.isArray(docs) ? docs : [];
                const main = list.find((d: ContentDocument) => d.content_key === `broker:${broker.slug}:main`) || list.find((d: ContentDocument) => d.slug === broker.slug || d.slug === 'main') || null;
                setDocument(main);
                setBlocks(Array.isArray(main?.blocks) ? main.blocks as PageBlock[] : []);
                setAvailabilityRows((Array.isArray(av) ? av : []).map((r: any) => ({ country_id: Number(r.country_id), status: r.status || 'unknown', note: r.note ?? r.notes ?? '', priority: Number(r.priority ?? 0) })));
                setCountries(Array.isArray(countryRows) ? countryRows : []);
              } catch (e) { setError(e instanceof Error ? e.message : 'Failed to load broker content'); }
              finally { setLoading(false); }
            }, [broker.id, broker.slug]);

            useEffect(() => { load(); }, [load]);

            const uploadImage = async (file: File) => {
              const reader = new FileReader();
              const data = await new Promise<string>((resolve, reject) => { reader.onload = () => resolve(String(reader.result)); reader.onerror = reject; reader.readAsDataURL(file); });
              const res = await fetch('/api/content-assets', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ filename: file.name, contentType: file.type, dataBase64: data }) });
              const out = await res.json().catch(() => ({}));
              if (!res.ok) throw new Error(out.error || 'Image upload failed');
              return out.url;
            };

            const saveAvailability = async () => {
              const rows = availabilityRows.filter((row) => row.country_id).map((row) => ({ ...row, priority: Number(row.priority) || 0 }));
              const res = await fetch('/api/broker-assets?resource=availability', { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ broker_id: broker.id, rows }) });
              const out = await res.json().catch(() => ({}));
              if (!res.ok) throw new Error(out.error || 'Could not save country availability');
            };

            const saveDocument = async () => {
              setBusy(true); setError('');
              try {
                const payload = {
                  ...(document || {}), id: document?.id, content_type: 'broker', content_key: `broker:${broker.slug}:main`, slug: broker.slug, country_slug: null, topic_slug: null,
                  title: document?.title || `${broker.name} review`, excerpt: document?.excerpt || broker.tagline || '', html: blocksToHtml(blocks), blocks,
                  seo_title: document?.seo_title || `${broker.name} review`, seo_description: document?.seo_description || broker.tagline || '', indexable: document?.indexable ?? true,
                  published: document?.published ?? true, settings: { ...(document?.settings || {}), brokerId: broker.id },
                };
                const res = await fetch('/api/content-documents', { method: document?.id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(payload) });
                const out = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(out.error || 'Could not save broker editorial content');
                const saved = (out?.data || out) as ContentDocument;
                setDocument(saved); setBlocks(Array.isArray(saved.blocks) ? saved.blocks as PageBlock[] : blocks);
                await saveAvailability(); await onSave(saved);
              } catch (e) { setError(e instanceof Error ? e.message : 'Could not save broker content'); }
              finally { setBusy(false); }
            };

            const updateAvailability = (countryId: number, patch: Partial<{ status: 'available' | 'restricted' | 'unavailable' | 'unknown'; note: string; priority: number }>) => {
              setAvailabilityRows((rows) => {
                const existing = rows.find((row) => row.country_id === countryId);
                if (existing) return rows.map((row) => row.country_id === countryId ? { ...row, ...patch } : row);
                return [...rows, { country_id: countryId, status: 'unknown', note: '', priority: 0, ...patch }];
              });
            };

            const availabilityByCountry = useMemo(() => new Map(availabilityRows.map((row) => [row.country_id, row])), [availabilityRows]);
            const visibleCountries = useMemo(() => countries.filter((c) => `${c.name} ${c.slug}`.toLowerCase().includes(countrySearch.toLowerCase().trim())), [countries, countrySearch]);

            return <div className="fixed inset-0 z-[90]">
              <div className="absolute inset-0 bg-ink-950/50 backdrop-blur-sm" onClick={onClose} />
              <div className="absolute inset-y-0 right-0 flex w-full flex-col bg-white shadow-soft-lg sm:max-w-6xl">
                <div className="flex items-center gap-3 bg-ink-950 px-5 py-4 text-white"><Monogram name={broker.name} logoUrl={broker.logo_url} color={broker.brand_color} size={38} className="rounded-xl" /><div className="min-w-0 flex-1"><p className="font-display text-lg font-bold">{broker.name} content CMS</p><p className="text-xs text-slate-400">Canonical broker editorial document — structured broker facts remain in Broker Editor.</p></div><button onClick={onClose} className="rounded-lg p-2 text-slate-400 hover:bg-white/10 hover:text-white"><X size={18} /></button></div>
                <div className="flex-1 overflow-y-auto p-5 sm:p-6">{error && <p className="mb-5 rounded-xl bg-rose-50 px-4 py-2.5 text-sm text-rose-600">{error}</p>}{loading ? <p className="text-sm text-slate-500">Loading…</p> : <div className="space-y-6">
                  <section className="rounded-2xl border border-emerald-200 bg-emerald-50/50 p-5"><div className="flex flex-wrap items-start justify-between gap-3"><div><h2 className="font-display text-xl font-bold text-ink-900">Broker editorial content</h2><p className="mt-1 text-xs leading-relaxed text-slate-500">One canonical visual editor for headings, rich text, images, broker cards, broker grids, comparison tables, CTAs, verdicts and other editorial blocks.</p></div><span className="rounded-full border border-emerald-200 bg-white px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-emerald-700">content_documents</span></div><div className="mt-4"><BrokerEditorialPageBuilder value={blocks} onChange={setBlocks} onUploadImage={uploadImage} /></div></section>
                  <section className="rounded-2xl border border-line bg-white p-5"><div className="flex items-center justify-between gap-3"><div><h2 className="font-display text-xl font-bold text-ink-900">Country eligibility</h2><p className="mt-1 text-xs text-slate-400">Availability is operational data, not editorial content.</p></div><span className="rounded-full border border-slate-200 bg-paper px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-500">separate source</span></div><div className="mt-3 flex items-center gap-2 rounded-xl border border-line bg-paper px-3"><Search size={14} className="text-slate-400" /><input value={countrySearch} onChange={(e) => setCountrySearch(e.target.value)} placeholder="Search countries…" className="h-10 flex-1 bg-transparent text-sm outline-none" /></div><div className="mt-3 max-h-96 overflow-auto rounded-xl border border-line bg-white"><table className="w-full text-left text-xs"><thead className="sticky top-0 bg-paper text-slate-500"><tr><th className="px-3 py-2">Country</th><th className="px-3 py-2">Status</th><th className="px-3 py-2">Priority</th><th className="px-3 py-2">Note</th></tr></thead><tbody className="divide-y divide-line">{visibleCountries.map((c) => { const row = availabilityByCountry.get(c.id) ?? { country_id: c.id, status: 'unknown' as const, note: '', priority: 0 }; return <tr key={c.id}><td className="px-3 py-2 font-bold text-ink-900">{c.flag} {c.name}<span className="ml-1 font-normal text-slate-400">/{c.slug}</span></td><td className="px-3 py-2"><select value={row.status} onChange={(e) => updateAvailability(c.id, { status: e.target.value as any })} className="h-9 rounded-lg border border-line bg-paper px-2 text-xs font-bold outline-none"><option value="unknown">Unknown</option><option value="available">Available</option><option value="restricted">Restricted</option><option value="unavailable">Unavailable</option></select></td><td className="px-3 py-2"><input type="number" value={row.priority} onChange={(e) => updateAvailability(c.id, { priority: Number(e.target.value) || 0 })} className="h-9 w-20 rounded-lg border border-line bg-paper px-2 text-xs outline-none" /></td><td className="px-3 py-2"><input value={row.note} onChange={(e) => updateAvailability(c.id, { note: e.target.value })} placeholder="Eligibility, entity or affiliate note…" className="h-9 w-full min-w-56 rounded-lg border border-line bg-paper px-2 text-xs outline-none" /></td></tr>; })}</tbody></table></div></section>
                </div>}</div>
                <div className="flex justify-end gap-3 border-t border-line bg-white px-5 py-4"><button onClick={onClose} className="rounded-xl border border-line px-4 py-2 text-xs font-bold text-slate-600">Close</button><button onClick={saveDocument} disabled={loading || busy} className="inline-flex items-center gap-2 rounded-xl bg-ink-950 px-5 py-2.5 text-xs font-bold text-white disabled:opacity-50">{busy && <Loader2 size={14} className="animate-spin" />} Save broker page</button></div>
              </div>
            </div>;
          }

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Verify no broker legacy endpoint in Admin
        run: |
          ! grep -n "resource=content" src/pages/Admin.tsx

      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx
          git commit -m "refactor: cut broker admin over to canonical editor [batch3-admin-cutover]"
          git push origin HEAD:fix/batch-3-broker-content-cutover
