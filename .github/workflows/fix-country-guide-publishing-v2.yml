name: Repair country guide publishing v2
on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/PageManager.tsx')
          s = p.read_text()
          s0 = s
          s = s.replace("{content_key:'',content_type:'country-topic',country_slug:'',topic_slug:'',slug:'',title:'',excerpt:'',html:'',blocks:[],seo_title:'',seo_description:'',indexable:true,published:true}", "{content_key:'',content_type:'country-guide',country_slug:'',topic_slug:'',slug:'',title:'',excerpt:'',html:'',blocks:[],seo_title:'',seo_description:'',indexable:true,published:true}")
          s = s.replace("const isBroker=form.content_type==='broker'; const route=isBroker&&form.slug?`/brokers/${form.slug}`:form.country_slug?(form.topic_slug?`/${form.country_slug}/${form.topic_slug}`:`/${form.country_slug}`):'#';", "const isBroker=form.content_type==='broker'; const route=isBroker&&form.slug?`/brokers/${form.slug}`:form.content_type==='country-guide'&&form.country_slug&&form.slug?`/${form.country_slug}/guides/${form.slug}`:form.country_slug?(form.topic_slug?`/${form.country_slug}/${form.topic_slug}`:`/${form.country_slug}`):'#';")
          s = s.replace("const key=form.content_key||(isBroker?`broker:${form.slug}:main`:`country-topic:${form.country_slug}:${form.topic_slug}`);", "const key=form.content_key||(isBroker?`broker:${form.slug}:main`:(form.content_type==='country-guide'?`country-guide:${form.country_slug}:${form.slug||form.topic_slug}`:`country-topic:${form.country_slug}:${form.topic_slug}`));")
          if s == s0:
              raise SystemExit('PageManager patch did not match')
          p.write_text(s)

          p = Path('api/content.js')
          s = p.read_text()
          s0 = s
          old = "  const topicSlug = body.topic_slug ? slugify(body.topic_slug) : null;\n  const contentKey = String(body.content_key || [contentType, countrySlug, topicSlug, body.slug].filter(Boolean).join(':')).slice(0, 180);"
          new = "  const topicSlug = body.topic_slug ? slugify(body.topic_slug) : null;\n  const slug = body.slug ? slugify(body.slug) : (topicSlug || slugify(body.title || body.content_key || '') || null);\n  const contentKey = String(body.content_key || [contentType, countrySlug, topicSlug, slug].filter(Boolean).join(':')).slice(0, 180);"
          if old not in s:
              raise SystemExit('API patch did not match')
          s = s.replace(old, new, 1).replace("    slug: body.slug ? slugify(body.slug) : null,", "    slug,", 1)
          p.write_text(s)

      - name: Validate
        run: |
          npm ci
          npx tsc -b
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PageManager.tsx api/content.js
          git commit -m 'fix: make country guides publishable [skip ci]' || exit 0
          git push origin seo/canonical-page-ownership-current-develop
