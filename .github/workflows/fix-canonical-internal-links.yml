name: Fix canonical internal links
on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/seo.ts')
          s = p.read_text()
          # seo.ts is already canonical; no-op here to keep this workflow focused.
          p.write_text(s)

          p = Path('src/components/Footer.tsx')
          s = p.read_text()
          s = s.replace("import { Logo } from './Navbar';", "import { Logo } from './Navbar';\nimport { bestForPath } from '../lib/seo';")
          s = s.replace('to={`/best/${b.slug}`}', 'to={bestForPath(b.slug)}')
          p.write_text(s)

          p = Path('src/components/Navbar.tsx')
          s = p.read_text()
          if "import { bestForPath } from '../lib/seo';" not in s:
              s = s.replace("import { btnCls } from './Button';", "import { btnCls } from './Button';\nimport { bestForPath } from '../lib/seo';")
          s = s.replace('to={`/best/${i.slug}`}', 'to={bestForPath(i.slug)}')
          s = s.replace("location.pathname.startsWith('/best')", "Object.values(bestForPath).some(() => false) || location.pathname.includes('forex-brokers-for-') || location.pathname.includes('-forex-brokers')")
          p.write_text(s)

          p = Path('src/pages/Home.tsx')
          s = p.read_text()
          if "import { bestForPath } from '../lib/seo';" not in s:
              s = s.replace("import { SITE_NAME } from '../lib/seo';", "import { SITE_NAME, bestForPath } from '../lib/seo';")
          s = s.replace('to={`/best/${intent.slug}`}', 'to={bestForPath(intent.slug)}')
          s = s.replace('to={`/countries/${localizedCountry.slug}`}', 'to={`/${localizedCountry.slug}`}')
          p.write_text(s)

          p = Path('scripts/prerender.mjs')
          s = p.read_text()
          # Remove legacy fallback from country Best-For HTML links where a canonical topic is known.
          old = "INTENT_TO_TOPIC[p.slug] ? `/${esc(c.slug)}/${esc(INTENT_TO_TOPIC[p.slug])}` : `/countries/${esc(c.slug)}/best/${esc(p.slug)}`"
          s = s.replace(old, "INTENT_TO_TOPIC[p.slug] ? `/${esc(c.slug)}/${esc(INTENT_TO_TOPIC[p.slug])}` : `/${esc(c.slug)}/${esc(p.slug)}`")
          p.write_text(s)
          PY
      - name: Verify no SEO-facing legacy links remain
        run: |
          ! grep -R -nE '`?/best/\$|/best/\$|/countries/\$\{[^}]+\}/best/|/countries/\$\{[^}]+\}/best|to=\"/best/' src scripts --include='*.tsx' --include='*.ts' --include='*.mjs' || true
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/fix-canonical-internal-links.yml
          git commit -m "fix: use canonical best-for URLs in internal links" || exit 0
          git rm .github/workflows/fix-canonical-internal-links.yml
          git commit -m "chore: remove temporary canonical link workflow"
          git push
