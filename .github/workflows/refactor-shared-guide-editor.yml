name: Refactor shared guide editor

on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0

      - name: Switch Admin to shared guide editor
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          if "import SharedGuideEditor from '../components/admin/GuideEditor';" not in s:
              s = s.replace("import LocalizationWorkspace from '../components/admin/LocalizationWorkspace';", "import LocalizationWorkspace from '../components/admin/LocalizationWorkspace';\nimport SharedGuideEditor from '../components/admin/GuideEditor';")

          old_global = '''      {editingGuide && (\n        <GuideEditor\n          guide={editingGuide === 'new' ? null : editingGuide}\n          token={session.access_token}\n          onClose={() => setEditingGuide(null)}\n          onSave={async (fields, isNew) => {\n            await mutate('/api/guides', isNew ? 'POST' : 'PUT', fields, isNew ? 'Guide published' : 'Guide saved');\n            if (isNew) setEditingGuide(null);\n          }}\n        />\n      )}'''
          new_global = '''      {editingGuide && (\n        <SharedGuideEditor\n          document={editingGuide === 'new' ? null : editingGuide}\n          context="global"\n          token={session.access_token}\n          onClose={() => setEditingGuide(null)}\n          onSave={async (fields, isNew) => {\n            await mutate('/api/guides', isNew ? 'POST' : 'PUT', fields, isNew ? 'Guide published' : 'Guide saved');\n            if (isNew) setEditingGuide(null);\n          }}\n        />\n      )}'''
          if old_global not in s:
              raise SystemExit('Global GuideEditor render block not found')
          s = s.replace(old_global, new_global, 1)

          old_country_new = "onNewCountryContentDoc={(slug) => { setNewDocDefaultCountry(slug); setEditingContentDoc('new'); }}"
          new_country_new = "onNewCountryContentDoc={(slug) => setEditingContentDoc({ id: 0, content_key: '', content_type: 'country-guide', country_slug: slug, topic_slug: null, slug: '', title: '', excerpt: '', html: '', blocks: [], seo_title: '', seo_description: '', indexable: false, published: false, updated_by: null, created_at: '', updated_at: '', settings: {} } as ContentDocument)}"
          if old_country_new not in s:
              raise SystemExit('Country new-guide callback not found')
          s = s.replace(old_country_new, new_country_new, 1)

          old_doc_drawer = '''      {editingContentDoc && (\n        <ContentDocumentEditor\n          document={editingContentDoc === 'new' ? null : editingContentDoc}\n          countries={countries}\n          token={session.access_token}\n          defaultCountrySlug={editingContentDoc === 'new' ? newDocDefaultCountry : undefined}\n          onClose={() => { setEditingContentDoc(null); setNewDocDefaultCountry(undefined); }}\n          onSave={async (fields, isNew) => {\n            await mutate('/api/content-documents', isNew ? 'POST' : 'PUT', fields, isNew ? 'Rich content published' : 'Rich content saved');\n            setEditingContentDoc(null);\n            setNewDocDefaultCountry(undefined);\n          }}\n        />\n      )}'''
          new_doc_drawer = '''      {editingContentDoc && editingContentDoc !== 'new' && editingContentDoc.content_type === 'country-guide' ? (\n        <SharedGuideEditor\n          document={editingContentDoc}\n          context="country"\n          countries={countries}\n          token={session.access_token}\n          countrySlug={editingContentDoc.country_slug || undefined}\n          onClose={() => setEditingContentDoc(null)}\n          onSave={async (fields, isNew) => {\n            await mutate('/api/content-documents', isNew ? 'POST' : 'PUT', fields, isNew ? 'Country guide published' : 'Country guide saved');\n            setEditingContentDoc(null);\n          }}\n        />\n      ) : editingContentDoc ? (\n        <ContentDocumentEditor\n          document={editingContentDoc === 'new' ? null : editingContentDoc}\n          countries={countries}\n          token={session.access_token}\n          defaultCountrySlug={editingContentDoc === 'new' ? newDocDefaultCountry : undefined}\n          onClose={() => { setEditingContentDoc(null); setNewDocDefaultCountry(undefined); }}\n          onSave={async (fields, isNew) => {\n            await mutate('/api/content-documents', isNew ? 'POST' : 'PUT', fields, isNew ? 'Rich content published' : 'Rich content saved');\n            setEditingContentDoc(null);\n            setNewDocDefaultCountry(undefined);\n          }}\n        />\n      ) : null}'''
          if old_doc_drawer not in s:
              raise SystemExit('ContentDocumentEditor drawer block not found')
          s = s.replace(old_doc_drawer, new_doc_drawer, 1)
          p.write_text(s)
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: use shared guide editor"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
