name: Audit canonical internal links

on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch remaining legacy Best-For internal links
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('src/pages/ComparePair.tsx'),
              Path('src/pages/BrokerDetail.tsx'),
              Path('src/pages/CountryDetail.tsx'),
              Path('src/pages/BestFor.tsx'),
              Path('src/pages/Admin.tsx'),
          ]

          for path in files:
              text = path.read_text()
              original = text

              # Add the canonical helper to files that need it.
              if "bestForPath" not in text and "from '../lib/seo'" in text:
                  text = text.replace("from '../lib/seo';", "from '../lib/seo';")
              if "bestForPath" not in text:
                  if "import { useSEO" in text:
                      text = text.replace("import { useSEO", "import { bestForPath } from '../lib/seo';\nimport { useSEO", 1)

              # Only rewrite actual React Link/Button destination props. Do not
              # touch analytics page-type classification or legacy redirect code.
              text = re.sub(r'to=\{`/best/\$\{([^}]+)\}`\}', r'to={bestForPath(\1)}', text)
              text = re.sub(r'to=\{`/best/\$\{([^}]+)\}`', r'to={bestForPath(\1)}', text)

              # Literal intent links used by admin previews.
              text = re.sub(r'to=\{`/best/\$\{i\.slug\}`\}', 'to={bestForPath(i.slug)}', text)

              if text != original:
                  path.write_text(text)
                  print(f'patched {path}')

      - name: Verify no accidental legacy link props remain
        shell: bash
        run: |
          if grep -RInE 'to=\{`/best/|href="/best/' src --include='*.tsx' --include='*.ts'; then
            echo 'Legacy Best-For internal link remains.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

      - name: Commit audit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No canonical internal-link changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ComparePair.tsx src/pages/BrokerDetail.tsx src/pages/CountryDetail.tsx src/pages/BestFor.tsx src/pages/Admin.tsx
          git commit -m 'fix: remove remaining legacy Best-For internal links [skip ci]'
          git push origin seo/canonical-page-ownership-current-develop
