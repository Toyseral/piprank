name: Fix admin preview links

on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop

permissions:
  contents: write

jobs:
  patch-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 1

      - name: Patch admin preview routes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()

          old = '''<div className="flex shrink-0 items-center gap-1">{doc.topic_slug&&<a href={`/${selected.slug}/${doc.topic_slug}`} target="_blank" rel="noreferrer" className="rounded-lg p-2 text-slate-400 hover:bg-paper" title="Preview live page (only works for registered topics)"><Eye size={14}/></a>}<button onClick={()=>onEditContentDoc(doc)} className="rounded-lg p-2 text-slate-400 hover:bg-paper" title="Edit page"><Pencil size={14}/></button></div>'''
          new = '''<div className="flex shrink-0 items-center gap-1">{(doc.content_type === 'country-guide' ? doc.slug : doc.topic_slug)&&<a href={doc.content_type === 'country-guide' ? `/${selected.slug}/guides/${doc.slug}` : `/${selected.slug}/${doc.topic_slug}`} target="_blank" rel="noreferrer" className="rounded-lg p-2 text-slate-400 hover:bg-paper" title="Preview live page"><Eye size={14}/></a>}<button onClick={()=>onEditContentDoc(doc)} className="rounded-lg p-2 text-slate-400 hover:bg-paper" title="Edit page"><Pencil size={14}/></button></div>'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Country content preview pattern not found')

          old2 = '''<button key={page.id} onClick={() => setEditingPage(page)} className="flex w-full items-center justify-between px-4 py-2.5 text-left hover:bg-paper">\n                    <span><span className="block text-xs font-bold text-ink-900">{page.title || page.slug}</span><span className="text-[11px] text-slate-400">{page.topic_key} · {page.published ? 'Published' : 'Draft'} · {page.indexable ? 'Indexable' : 'Noindex'}</span></span>\n                    <Pencil size={12} className="text-slate-400" />\n                  </button>'''
          new2 = '''<div key={page.id} className="flex items-center justify-between px-4 py-2.5 hover:bg-paper">\n                    <button onClick={() => setEditingPage(page)} className="min-w-0 flex-1 text-left">\n                      <span><span className="block text-xs font-bold text-ink-900">{page.title || page.slug}</span><span className="text-[11px] text-slate-400">{page.topic_key} · {page.published ? 'Published' : 'Draft'} · {page.indexable ? 'Indexable' : 'Noindex'}</span></span>\n                    </button>\n                    <div className="flex shrink-0 items-center gap-1">\n                      <a href={`/${country.slug}/${lang.url_prefix}/${page.slug}?preview=1`} target="_blank" rel="noreferrer" className="rounded-lg p-1.5 text-slate-400 hover:bg-white hover:text-ink-900" title="Preview localized page"><Eye size={13} /></a>\n                      <button onClick={() => setEditingPage(page)} className="rounded-lg p-1.5 text-slate-400 hover:bg-white hover:text-ink-900" title="Edit localized page"><Pencil size={12} /></button>\n                    </div>\n                  </div>'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          else:
              raise SystemExit('Localization preview pattern not found')

          old3 = '''<select value={form.content_type} onChange={e=>setForm({...form,content_type:e.target.value})} className={input}><option value="country-topic">Country topic</option><option value="country">Country</option>'''
          new3 = '''<select value={form.content_type} onChange={e=>setForm({...form,content_type:e.target.value})} className={input}><option value="country-topic">Country topic</option><option value="country-guide">Country guide</option><option value="country">Country</option>'''
          if old3 in s:
              s = s.replace(old3, new3, 1)
          else:
              raise SystemExit('Content type option pattern not found')

          p.write_text(s)

      - name: Commit admin fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx .github/workflows/fix-admin-preview-links.yml
          git rm .github/workflows/fix-admin-preview-links.yml
          git commit -m "Fix admin guide and localization preview links"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
