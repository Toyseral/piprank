name: Clean country guide manager
on:
  push:
    branches: [seo/canonical-page-ownership-current-develop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch country guide manager
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PageManager.tsx')
          s = p.read_text()
          s = s.replace("const docs=contentDocs.map(d=>", "const docs=contentDocs.filter(d=>d.content_type!=='country-best-for').map(d=>", 1)
          s = s.replace("d.country_slug&&d.topic_slug?`/${d.country_slug}/${d.topic_slug}`", "d.content_type==='country-guide'&&d.country_slug&&d.slug?`/${d.country_slug}/guides/${d.slug}`:d.country_slug&&d.topic_slug?`/${d.country_slug}/${d.topic_slug}`", 1)
          s = s.replace("content_type:'country-topic'", "content_type:'country-guide'", 1)
          p.write_text(s)
          PY
      - name: Validate build
        run: |
          npm ci
          npx tsc -b
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PageManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean country guide manager listing [skip ci]'
          git push
