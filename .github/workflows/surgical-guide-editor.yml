name: Surgical Guide Editor Integration

on:
  push:
    branches:
      - feature/pagebuilder-canonical-editors

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor == 'Toyseral'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire PageBuilder guide editor
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/Admin.tsx')
          s = p.read_text()

          import_line = "import GuidePageBuilderEditor from '../components/admin/GuidePageBuilderEditor';"
          if import_line not in s:
              anchor = "import PageManager from '../components/PageManager';"
              if anchor not in s:
                  raise SystemExit('Admin import anchor not found')
              s = s.replace(anchor, anchor + "\n" + import_line, 1)

          start = s.find('function GuideEditor({')
          marker = '\n/* ============================ INTENT EDITOR ============================ */'
          end = s.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit('GuideEditor boundaries not found')

          replacement = '''function GuideEditor({
            guide,
            onClose,
            onSave,
          }: {
            guide: Guide | null;
            onClose: () => void;
            onSave: (fields: Record<string, unknown>, isNew: boolean) => Promise<void>;
          }) {
            return (
              <GuidePageBuilderEditor
                guide={guide}
                onClose={onClose}
                onSave={onSave}
              />
            );
          }
'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)

      - name: Commit integration and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx
          git rm .github/workflows/surgical-guide-editor.yml
          git commit -m "feat: wire PageBuilder into legacy guide editor"
          git push
