name: Fix shared guide editor narrowing

on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - name: Fix TypeScript narrowing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/PageManager.tsx')
          text = p.read_text()
          old = "if(editing!==null){if(editing.content_type==='guide'||editing.content_type==='country-guide')return <GuideEditor document={editing} context={editing.content_type==='country-guide'?'country':'global'} countries={countries} token={token} countrySlug={editing.country_slug||undefined} onClose={()=>setEditing(null)} onSave={async(f,n)=>{await onSave(f,n);setEditing(null)}}/>;return <PageManagerEditor document={editing||null} countries={countries} brokers={brokers} token={token} onClose={()=>setEditing(null)} onSave={async(f,n)=>{await onSave(f,n);setEditing(null)}}/>;}"
          new = "if(editing!==null){if(editing && (editing.content_type==='guide'||editing.content_type==='country-guide'))return <GuideEditor document={editing} context={editing.content_type==='country-guide'?'country':'global'} countries={countries} token={token} countrySlug={editing.country_slug||undefined} onClose={()=>setEditing(null)} onSave={async(f,n)=>{await onSave(f,n);setEditing(null)}}/>;return <PageManagerEditor document={editing||null} countries={countries} brokers={brokers} token={token} onClose={()=>setEditing(null)} onSave={async(f,n)=>{await onSave(f,n);setEditing(null)}}/>;}"
          if old not in text:
              raise SystemExit('target not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PageManager.tsx
          git commit -m 'fix: narrow optional guide editor document' || exit 0
          git push origin HEAD:seo/canonical-page-ownership-current-develop
