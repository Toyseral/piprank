name: Restore admin after bad edit
on:
  push:
    branches: [seo/canonical-page-ownership-current-develop]
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore Admin.tsx from known-good commit
        run: |
          git show 61b8655f41fe79a25926881c60e85a37f4c7d693:src/pages/Admin.tsx > src/pages/Admin.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          pattern = r"safeJson(?:<[^>]+>)?\(fetch\('/api/track\?resource=clicks', \{ headers: headers\(\) \}\), \{[^\n]+\}\),"
          replacement = "safeJson<ClicksAgg>(fetch('/api/track?resource=clicks', { headers: headers() }), { total: 0, byBroker: {}, byPage: {}, byDay: [], recent: [] }),"
          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('clicks loader line not found')
          p.write_text(s2)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit restored Admin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx
          git commit -m "fix: restore admin and correct clicks fallback"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
          git rm .github/workflows/restore-admin-build.yml
          git commit -m "chore: remove temporary admin restore workflow"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
