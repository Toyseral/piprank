name: Finish canonical admin preview cleanup
on:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - name: Patch canonical admin paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          replacements = {
            '/countries/{c.slug} · {c.recommended.length} picks': '/{c.slug} · {c.recommended.length} picks',
            '/best/{i.slug}': '/{SUPERSEDED_INTENT_TO_TOPIC[i.slug] ?? i.slug}',
            'href={`/best/${i.slug}`}': 'href={`/${SUPERSEDED_INTENT_TO_TOPIC[i.slug] ?? i.slug}`}',
            'path: `/countries/${countrySlug}`': 'path: `/${countrySlug}`',
          }
          changed = False
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new)
              changed = True
          p.write_text(s)
          print('changed', changed)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Admin.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Finish canonical admin preview paths'
            git push origin seo/canonical-page-ownership-current-develop
          fi
          git rm .github/workflows/fix-admin-bestfor-preview.yml
          git commit -m 'Remove temporary admin preview workflow'
          git push origin seo/canonical-page-ownership-current-develop
