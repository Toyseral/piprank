name: Build localization workspace
on:
  push:
    branches: [seo/canonical-page-ownership-current-develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch Admin and routes
        run: |
          python3 <<'PY'
          from pathlib import Path
          admin = Path('src/pages/Admin.tsx')
          s = admin.read_text()
          if "../components/admin/LocalizationWorkspace" not in s:
              s = s.replace("import PageBuilder, { blocksToHtml, type PageBlock } from '../components/PageBuilder';", "import PageBuilder, { blocksToHtml, type PageBlock } from '../components/PageBuilder';\nimport LocalizationWorkspace from '../components/admin/LocalizationWorkspace';")
          s = s.replace("type Tab = 'overview' | 'brokers' | 'countries' | 'global' | 'authors' | 'commercial' | 'analytics' | 'team';", "type Tab = 'overview' | 'brokers' | 'countries' | 'global' | 'localization' | 'authors' | 'commercial' | 'analytics' | 'team';")
          s = s.replace("  countries: ['super_admin', 'admin', 'content_admin', 'brokers_admin'],\n  global:", "  countries: ['super_admin', 'admin', 'content_admin', 'brokers_admin'],\n  localization: ['super_admin', 'admin', 'content_admin'],\n  global:")
          s = s.replace("  { key: 'countries', label: 'Country Hub', icon: Globe2, desc: 'Manage country overview, publishing, SEO, brokers, best-for pages, guides, FAQs and internal links.' },\n  { key: 'global'", "  { key: 'countries', label: 'Country Hub', icon: Globe2, desc: 'Manage country overview, publishing, SEO, brokers, best-for pages, guides, FAQs and internal links.' },\n  { key: 'localization', label: 'Localization', icon: Globe2, desc: 'Manage local-language guides and country Best-For pages.' },\n  { key: 'global'")
          s = s.replace("  if (value === 'pages' || value === 'content' || value === 'rankings' || value === 'localization') return 'countries';", "  if (value === 'pages' || value === 'content' || value === 'rankings') return 'countries';")
          marker = "{tab === 'global'"
          if "{tab === 'localization' && (" not in s:
              idx = s.find(marker)
              if idx < 0: raise SystemExit('Could not locate Global Hub render block')
              block = """{tab === 'localization' && (\n                  <LocalizationWorkspace\n                    countries={countries}\n                    languages={countryLanguages}\n                    pages={localizedPages}\n                    contentDocs={contentDocs}\n                    mutate={mutate}\n                    accessToken={session.access_token}\n                  />\n                )}\n                """
              s = s[:idx] + block + s[idx:]
          admin.write_text(s)
          app = Path('src/App.tsx')
          a = app.read_text()
          if "const LocalizedGuide = lazy(() => import('./pages/LocalizedGuide'));" not in a:
              a = a.replace("const GuideTopic = lazy(() => import('./pages/GuideTopic'));", "const GuideTopic = lazy(() => import('./pages/GuideTopic'));\nconst LocalizedGuide = lazy(() => import('./pages/LocalizedGuide'));")
          route = '          <Route path="/:countrySlug/:locale/guides/:slug" element={<LocalizedGuide />} />'
          if route not in a:
              a = a.replace('          <Route path="/:countrySlug/:locale/:topicSlug" element={<LocalizedCountrySeoTopic />} />', route + '\n          <Route path="/:countrySlug/:locale/:topicSlug" element={<LocalizedCountrySeoTopic />} />')
          app.write_text(a)
          lg = Path('src/components/admin/LocalizedGuidesManager.tsx')
          lg.write_text(lg.read_text().replace("import { legacySectionsToBlocks } from '../../lib/contentBlocks';\n", ''))
          PY
      - run: npx tsc -b
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx src/App.tsx src/components/admin/LocalizedGuidesManager.tsx
          git diff --cached --quiet || git commit -m "Add localization admin workspace"
          git push origin seo/canonical-page-ownership-current-develop
