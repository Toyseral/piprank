name: Fix admin clicks type
on:
  push:
    branches: [seo/canonical-page-ownership-current-develop]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch clicks response type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          old = "safeJson(fetch('/api/track?resource=clicks', { headers: headers() }), { total: 0, byBroker: {}, byDay: [], recent: [] }),"
          new = "safeJson<ClicksAgg>(fetch('/api/track?resource=clicks', { headers: headers() }), { total: 0, byBroker: {}, byDay: [], recent: [] }),"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx
          git commit -m "fix: type admin clicks loader response"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
          git rm .github/workflows/fix-admin-clicks-type.yml
          git commit -m "chore: remove temporary admin clicks workflow"
          git push origin HEAD:seo/canonical-page-ownership-current-develop
