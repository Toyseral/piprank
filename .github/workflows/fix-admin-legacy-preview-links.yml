name: Fix remaining admin legacy preview links

on:
  workflow_dispatch:
  push:
    branches:
      - seo/canonical-page-ownership-current-develop

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 0

      - name: Replace legacy admin preview routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          s = s.replace('to={`/best/${i.slug}`}', 'to={`/${SUPERSEDED_INTENT_TO_TOPIC[i.slug] ?? i.slug}`}')
          s = s.replace('`/countries/${p.country_slug}/best/${p.slug}`', '`/${p.country_slug}/${SUPERSEDED_INTENT_TO_TOPIC[p.slug] ?? p.slug}`')
          s = s.replace('`/countries/${p.country_slug}/best/${p.slug} · ${p.indexable ? \'Indexable\' : \'Noindex\'}`', '`/${p.country_slug}/${SUPERSEDED_INTENT_TO_TOPIC[p.slug] ?? p.slug} · ${p.indexable ? \'Indexable\' : \'Noindex\'}`')
          p.write_text(s)
          PY

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Admin.tsx
          git commit -m 'fix: remove remaining legacy admin preview links' || true
          git push origin HEAD:seo/canonical-page-ownership-current-develop
          git rm .github/workflows/fix-admin-legacy-preview-links.yml || true
          git commit -m 'chore: remove temporary admin preview workflow' || true
          git push origin HEAD:seo/canonical-page-ownership-current-develop
