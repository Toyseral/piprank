name: Integrate Admin Localization
on:
  push:
    branches: [seo/canonical-page-ownership-current-develop]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Admin.tsx')
          s = p.read_text()
          s = s.replace("import supabase from '../lib/supabase';", "import supabase from '../lib/supabase';\nimport LocalizationWorkspace from '../components/admin/LocalizationWorkspace';")
          s = s.replace("type Tab = 'overview' | 'brokers' | 'countries' | 'global' | 'authors' | 'commercial' | 'analytics' | 'team';", "type Tab = 'overview' | 'brokers' | 'countries' | 'global' | 'localization' | 'authors' | 'commercial' | 'analytics' | 'team';")
          s = s.replace("  global: ['super_admin', 'admin', 'content_admin'],", "  global: ['super_admin', 'admin', 'content_admin'],\n  localization: ['super_admin', 'admin', 'content_admin'],")
          s = s.replace("  { key: 'global', label: 'Global Hub', icon: BookOpen, desc: 'Manage guides and best-for pages that are not country-specific.' },", "  { key: 'global', label: 'Global Hub', icon: BookOpen, desc: 'Manage guides and best-for pages that are not country-specific.' },\n  { key: 'localization', label: 'Localization', icon: Languages, desc: 'Manage translated guides and localized Best-For content by country and language.' },")
          s = s.replace("  if (value === 'pages' || value === 'content' || value === 'rankings' || value === 'localization') return 'countries';", "  if (value === 'pages' || value === 'content' || value === 'rankings') return 'countries';")
          s = s.replace("                {activeTab === 'global' && (\n                  <GlobalHub", "                {activeTab === 'localization' && (\n                  <LocalizationWorkspace\n                    countries={countries}\n                    languages={countryLanguages}\n                    pages={localizedPages}\n                    contentDocs={contentDocs}\n                    mutate={mutate}\n                    accessToken={session.access_token}\n                  />\n                )}\n                {activeTab === 'global' && (\n                  <GlobalHub")
          if "Languages," not in s.split("} from 'lucide-react';",1)[0]:
              s = s.replace("  Globe2,\n  X,", "  Globe2,\n  Languages,\n  X,")
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q "key: 'localization'" src/pages/Admin.tsx
          grep -q "LocalizationWorkspace" src/pages/Admin.tsx
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/integrate-admin-localization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx .github/workflows/integrate-admin-localization.yml
          git commit -m "feat: add localization to admin navigation"
          git push