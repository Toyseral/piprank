name: Apply global hub route fix
on:
  push:
    branches:
      - tmp/fix-global-hub-preview
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/canonical-page-ownership-current-develop
          fetch-depth: 1
      - name: Patch canonical prerender paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/prerender.mjs')
          s = p.read_text()
          s = s.replace("webPageJsonLd(title, description, `/best/${p.slug}`, 'WebPage')", "webPageJsonLd(title, description, globalBestForPath(p.slug), 'WebPage')")
          s = s.replace("writePage(`/best/${p.slug}`, { title, description, path: globalBestForPath(p.slug) }", "writePage(globalBestForPath(p.slug), { title, description, path: globalBestForPath(p.slug) }")
          p.write_text(s)
          PY
      - name: Commit target changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add scripts/prerender.mjs
          git commit -m 'Use canonical paths for global Best-For prerendering'
          git push origin seo/canonical-page-ownership-current-develop
      - name: Remove workflow from target
        if: always()
        run: |
          git rm .github/workflows/apply-global-hub-fix.yml || true
          git commit -m 'Remove one-time global hub fix workflow' || true
          git push origin seo/canonical-page-ownership-current-develop || true
